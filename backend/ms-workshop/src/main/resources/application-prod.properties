spring.datasource.url=${WORKSHOP_DB_URL}
spring.datasource.username=${WORKSHOP_DB_USER}
spring.datasource.password=${WORKSHOP_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}