
spring.application.name=ms-workshop
server.port=8083
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ==========================================
# KAFKA - CONEXION
# ==========================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

# ==========================================
# KAFKA - PRODUCTOR
# ==========================================

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# ==========================================
# KAFKA - CONSUMIDOR
# ==========================================

spring.kafka.consumer.group-id=${KAFKA_WORKSHOP_GROUP:salfa360-workshop-history}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.allow.auto.create.topics=false

spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.admin.auto-create=false

# ==========================================
# KAFKA - TOPICOS Y ACTIVACION
# ==========================================

salfa.kafka.enabled=${SALFA_KAFKA_ENABLED:false}
salfa.kafka.topics.workshops=${KAFKA_WORKSHOP_TOPIC:workshop.events}
salfa.kafka.topics.workshops-dlq=${KAFKA_WORKSHOP_DLQ:workshop.events.dlq}

salfa.workshop.outbox.enabled=${WORKSHOP_OUTBOX_ENABLED:false}
salfa.workshop.outbox.poll-ms=${OUTBOX_POLL_MS:5000}
