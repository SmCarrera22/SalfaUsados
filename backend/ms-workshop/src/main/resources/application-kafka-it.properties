# ==========================================
# SALFA360 - WORKSHOP KAFKA INTEGRATION
# ==========================================

# PostgreSQL aislado
spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/salfa360_workshop_kafka_it
spring.datasource.username=outbox_test
spring.datasource.password=${WORKSHOP_IT_DB_PASSWORD}

# Solo para el entorno aislado de integración
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# RabbitMQ no participa en este perfil de pruebas
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.rabbitmq.dynamic=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.consumer.group-id=salfa360-workshop-history
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.allow.auto.create.topics=false

spring.kafka.listener.ack-mode=manual
spring.kafka.admin.auto-create=false

# Activación explícita
salfa.kafka.enabled=true
salfa.kafka.topics.workshops=workshop.events
salfa.kafka.topics.workshops-dlq=workshop.events.dlq
salfa.workshop.outbox.enabled=true

# Servidor accesible únicamente desde este Mac
server.address=127.0.0.1

