
# Integración local Outbox + PostgreSQL + Kafka
# No utilizar con bases compartidas ni producción.

server.port=18082

spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/salfa360_outbox_it
spring.datasource.username=outbox_test
spring.datasource.password=${OUTBOX_IT_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092,localhost:9093,localhost:9094

salfa.kafka.enabled=${SALFA_KAFKA_ENABLED:false}
salfa.outbox.dispatcher.enabled=${OUTBOX_DISPATCHER_ENABLED:false}
salfa.outbox.dispatcher.poll-ms=5000

spring.kafka.listener.ack-mode=manual_immediate