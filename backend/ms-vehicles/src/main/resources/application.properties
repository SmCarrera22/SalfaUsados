spring.application.name=ms-vehicles
server.port=8082


# Kafka - Salfa360
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.consumer.group-id=salfa360-vehicle-history
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Mantener la integración desactivada hasta validarla
salfa.kafka.enabled=${SALFA_KAFKA_ENABLED:false}

# Topico de eventos de vehiculos
salfa.kafka.topics.vehicles=vehicle.events

# Confirmacion manual despues del procesamiento
spring.kafka.listener.ack-mode=manual_immediate

# No crear topicos automaticamente
spring.kafka.admin.auto-create=false

# Hasta que implementemos recuperacion persistente
spring.kafka.consumer.properties.allow.auto.create.topics=false

salfa.outbox.dispatcher.enabled=${OUTBOX_DISPATCHER_ENABLED:false}
salfa.outbox.dispatcher.poll-ms=${OUTBOX_POLL_MS:5000}

# Kafka - grupos de consumidores
salfa.kafka.groups.history=${KAFKA_HISTORY_GROUP:salfa360-vehicle-history}
salfa.kafka.groups.analytics=${KAFKA_ANALYTICS_GROUP:salfa360-vehicle-analytics}

# Activacion independiente de consumidores
salfa.kafka.history.enabled=${KAFKA_HISTORY_ENABLED:true}
salfa.kafka.analytics.enabled=${KAFKA_ANALYTICS_ENABLED:false}